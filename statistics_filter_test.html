<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>统计筛选功能测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0,0,0,01);
        }
        h2 { color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        .filter-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .result-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            min-height: 100px;
        }
        .success { color: #28a745; font-weight: 600; }
        .info { color: #667eea; font-weight: 600; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🔍 统计筛选功能测试</h1>

    <div class="test-section">
        <h2>1. 测试总览统计</h2>
        <div class="filter-controls">
            <select id="stats-type">
                <option value="overview">总览统计</option>
                <option value="muscle">按肌肉群筛选</option>
                <option value="exercise">按动作筛选</option>
            </select>
            <select id="stats-target">
                <option value="">全部</option>
            </select>
            <button onclick="testStats()">测试筛选</button>
        </div>
        <div id="result" class="result-display">
            点击"测试筛选"按钮测试功能...
        </div>
    </div>

    <div class="test-section">
        <h2>2. 数据验证</h2>
        <pre id="data-log">等待加载...</pre>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let exercises = [];

        function log(message) {
            const logEl = document.getElementById('data-log');
            const time = new Date().toLocaleTimeString();
            logEl.textContent = `[${time}] ${message}\n` + logEl.textContent;
        }

        async function loadData() {
            try {
                log('正在加载动作列表...');
                const res = await fetch(`${API_BASE}/exercises`);
                exercises = await res.json();
                log(`✅ 成功加载 ${exercises.length} 个动作`);

                // 显示肌肉群选项
                const muscleGroups = [...new Set(exercises.filter(e => e.id > 0).map(e => e.muscleGroup))];
                log(`肌肉群: ${muscleGroups.join(', ')}`);

                // 显示动作选项
                const validExercises = exercises.filter(e => e.id > 0);
                log(`动作列表: ${validExercises.map(e => `${e.name}(${e.id})`).join(', ')}`);

            } catch (err) {
                log(`❌ 加载失败: ${err.message}`);
            }
        }

        async function testStats() {
            const type = document.getElementById('stats-type').value;
            const target = document.getElementById('stats-target').value;

            log(`开始测试筛选: type=${type}, target=${target}`);

            try {
                if (type === 'overview' || !target) {
                    await testOverviewStats();
                } else if (type === 'muscle') {
                    await testMuscleStats(target);
                } else if (type === 'exercise') {
                    await testExerciseStats(target);
                }
            } catch (err) {
                log(`❌ 测试失败: ${err.message}`);
                document.getElementById('result').innerHTML = `<span class="error">❌ ${err.message}</span>`;
            }
        }

        async function testOverviewStats() {
            log('测试总览统计...');

            const volumeData = await fetch(`${API_BASE}/stats/volume?days=30`).then(r => r.json());
            const frequencyData = await fetch(`${API_BASE}/stats/frequency`).then(r => r.json());
            const prData = await fetch(`${API_BASE}/stats/personal-records`).then(r => r.json());

            document.getElementById('result').innerHTML = `
                <span class="success">✅ 总览统计测试成功!</span><br><br>
                <strong>总容量:</strong> ${Math.round(volumeData.totalVolume || 0)} kg<br>
                <strong>平均容量:</strong> ${Math.round(volumeData.averageVolume || 0)} kg<br>
                <strong>本周训练:</strong> ${frequencyData.weeklyFrequency} 次<br>
                <strong>连续训练:</strong> ${frequencyData.trainingStreak} 周<br>
                <strong>个人记录:</strong> ${prData.length} 个<br>
            `;
        }

        async function testMuscleStats(muscleGroup) {
            log(`测试肌肉群统计: ${muscleGroup}`);

            const exercises = await fetch(`${API_BASE}/exercises`).then(r => r.json());
            const muscleExercises = exercises.filter(e => e.muscleGroup === muscleGroup && e.id > 0);

            document.getElementById('result').innerHTML = `
                <span class="success">✅ 肌肉群统计测试成功!</span><br><br>
                <strong>肌肉群:</strong> ${muscleGroup}<br>
                <strong>包含动作:</strong> ${muscleExercises.map(e => e.name).join(', ')}<br>
                <strong>动作数量:</strong> ${muscleExercises.length}<br>
            `;
        }

        async function testExerciseStats(exerciseId) {
            log(`测试单个动作统计: ID=${exerciseId}`);

            const exercises = await fetch(`${API_BASE}/exercises`).then(r => r.json());
            const exercise = exercises.find(e => e.id == exerciseId);

            if (!exercise) {
                log(`❌ 找不到ID为${exerciseId}的动作`);
                return;
            }

            try {
                const progress = await fetch(`${API_BASE}/stats/progress-rate/${exerciseId}?target=100`).then(r => r.json());

                document.getElementById('result').innerHTML = `
                    <span class="success">✅ 动作统计测试成功!</span><br><br>
                    <strong>动作名称:</strong> ${exercise.name}<br>
                    <strong>肌肉部位:</strong> ${exercise.muscleGroup}<br>
                    <strong>单位类型:</strong> ${exercise.unit === 'kg' ? '重量' : '持续时间'}<br>
                    <strong>容量增长率:</strong> ${progress.volumeGrowthRate ? progress.volumeGrowthRate.toFixed(2) + '%' : '--'}<br>
                    <strong>重量增长率:</strong> ${progress.weightGrowthRate ? progress.weightGrowthRate.toFixed(2) + '%' : '--'}<br>
                    <strong>次数增长率:</strong> ${progress.repsGrowthRate ? progress.repsGrowthRate.toFixed(2) + '%' : '--'}<br>
                `;
            } catch (err) {
                log(`⚠️ 无法获取进度数据: ${err.message}`);
                document.getElementById('result').innerHTML = `
                    <span class="info">⚠️ 动作基本信息获取成功</span><br><br>
                    <strong>动作名称:</strong> ${exercise.name}<br>
                    <strong>肌肉部位:</strong> ${exercise.muscleGroup}<br>
                    <strong>单位类型:</strong> ${exercise.unit === 'kg' ? '重量' : '持续时间'}<br>
                    <span class="error">暂无进度统计数据</span>
                `;
            }
        }

        // 页面加载时自动加载数据
        window.addEventListener('load', loadData);
    </script>
</body>
</html>

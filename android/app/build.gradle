plugins {
    id "com.android.application"
}

def releaseKeystore = System.getenv("FITNESS_ANDROID_KEYSTORE")
def releaseStorePassword = System.getenv("FITNESS_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("FITNESS_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("FITNESS_ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.lbs.fitnesstracker"
    compileSdk 35

    defaultConfig {
        applicationId "com.lbs.fitnesstracker"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.3.0"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

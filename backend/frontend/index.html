<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健身记录</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 导航 -->
        <nav class="nav">
            <button class="nav-btn active" data-page="training">今日训练</button>
            <button class="nav-btn" data-page="exercises">动作管理</button>
            <button class="nav-btn" data-page="notes">笔记</button>
            <button class="nav-btn" data-page="todos">待办</button>
            <button class="nav-btn" data-page="challenges">挑战</button>
            <button class="nav-btn" data-page="statistics">统计分析</button>
        </nav>

        <!-- 今日训练页面 -->
        <div id="page-training" class="page active">
            <div class="header">
                <h1>健身记录</h1>
                <div class="date-display">
                    <label>日期:</label>
                    <input type="date" id="training-date" />
                </div>
            </div>

            <div class="section">
                <h2>选择今日训练计划</h2>
                <div id="groups-container" class="groups-grid">
                    <!-- 动态加载动作组 -->
                </div>
            </div>

            <div class="section">
                <h2>当天已记录训练</h2>
                <div id="date-sessions-container" class="groups-grid">
                    <!-- 动态加载某天已保存训练 -->
                </div>
            </div>
        </div>

        <!-- 训练详情页面 (点击动作组后显示) -->
        <div id="page-training-detail" class="page">
            <div class="header">
                <button id="back-to-groups" class="back-btn">← 返回</button>
                <h1 id="group-name">胸肌训练</h1>
                <div class="date-display">
                    <input type="date" id="detail-date" />
                    <label>训练时长:</label>
                    <input type="number" inputmode="numeric" id="training-duration" value="40" min="1" />
                    <span class="unit-label-inline">分钟</span>
                </div>
            </div>

            <div id="exercises-list" class="exercises-list">
                <!-- 动态加载动作 -->
            </div>

            <div class="actions">
                <button id="cancel-session" class="btn btn-secondary">取消</button>
                <button id="save-session" class="btn btn-primary">保存本次训练</button>
            </div>
        </div>

        <!-- 动作管理页面 -->
        <div id="page-exercises" class="page">
            <div class="header">
                <h1>动作管理</h1>
                <button id="add-exercise-btn" class="btn btn-primary">添加动作</button>
            </div>

            <div class="section">
                <h2>动作库</h2>
                <div id="exercises-table-container"></div>
            </div>

            <div class="section">
                <h2>动作组</h2>
                <div id="groups-table-container"></div>
                <button id="add-group-btn" class="btn btn-primary">添加动作组</button>
            </div>
        </div>

        <!-- 笔记页面 -->
        <div id="page-notes" class="page">
            <div class="header">
                <h1>笔记</h1>
                <div class="note-tag-create">
                    <input type="text" id="note-tag-name" placeholder="新标签" />
                    <button id="add-note-tag-btn" class="btn btn-primary">添加标签</button>
                </div>
            </div>

            <div class="notes-layout">
                <div class="note-tags-panel">
                    <div class="section">
                        <h2>常用标签</h2>
                        <div id="popular-note-tags" class="note-tag-list"></div>
                    </div>
                    <div class="section">
                        <h2>全部标签</h2>
                        <div id="all-note-tags" class="note-tag-list"></div>
                    </div>
                </div>

                <div class="note-editor-panel">
                    <div class="note-editor-header">
                        <h2 id="current-note-tag">选择标签</h2>
                        <div class="note-editor-actions">
                            <button id="new-note-btn" class="btn btn-secondary" disabled>新建笔记</button>
                            <span id="note-save-status" class="note-save-status">未选择</span>
                        </div>
                    </div>
                    <textarea id="note-content" class="note-content" disabled placeholder="选择标签后记录笔记"></textarea>
                    <div class="note-history-panel">
                        <div class="note-history-header">
                            <h2>历史笔记</h2>
                        </div>
                        <div id="note-history-list" class="note-history-list">
                            <p class="empty-hint">选择标签后查看历史笔记</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 待办页面 -->
        <div id="page-todos" class="page">
            <div class="header">
                <h1>待办事项</h1>
                <form id="todo-create-form" class="todo-create">
                    <input type="text" id="todo-title" placeholder="新增待办事项" autocomplete="off" />
                    <button type="submit" class="btn btn-primary">添加</button>
                </form>
            </div>

            <div class="section">
                <div class="section-title-row">
                    <h2>待办</h2>
                    <span id="todo-summary" class="todo-summary">0 项</span>
                </div>
                <div id="todo-active-list" class="todo-list">
                    <p class="empty-hint">暂无待办事项</p>
                </div>
            </div>

            <div class="section">
                <div class="section-title-row">
                    <h2>已完成列表</h2>
                </div>
                <button id="show-completed-todos-btn" class="todo-completed-entry" type="button">
                    <span>已完成列表</span>
                    <strong id="todo-completed-count">0 项</strong>
                </button>
            </div>
        </div>

        <div id="page-challenges" class="page">
            <div class="header">
                <h1>每日挑战</h1>
                <div class="date-display">
                    <label>日期:</label>
                    <input type="date" id="challenge-date" />
                </div>
            </div>

            <div class="section challenge-create-section">
                <h2>新建挑战</h2>
                <form id="challenge-create-form" class="challenge-create-form">
                    <input type="text" id="challenge-name" placeholder="挑战名称，例如：7天生活习惯" autocomplete="off" />
                    <label class="challenge-days-label">周期 <input type="number" id="challenge-days" min="1" max="366" value="7" inputmode="numeric" /> 天</label>
                    <textarea id="challenge-items" rows="4" placeholder="每行一个事项，例如：&#10;刷牙&#10;剪指甲&#10;读书一小时" required></textarea>
                    <button type="submit" class="btn btn-primary">创建挑战</button>
                </form>
            </div>

            <div class="section">
                <div class="section-title-row">
                    <h2>当天挑战</h2>
                    <span id="challenge-day-summary" class="todo-summary">0 / 0 · 0%</span>
                </div>
                <div id="challenge-day-list" class="challenge-day-list">
                    <p class="empty-hint">当天没有挑战事项</p>
                </div>
            </div>
        </div>

        <!-- 统计分析页面 -->
        <div id="page-statistics" class="page">
            <div class="header">
                <h1>📊 统计分析</h1>
                <div class="date-display">
                    <label>统计周期:</label>
                    <select id="stats-period">
                        <option value="7">最近7天</option>
                        <option value="30" selected>最近30天</option>
                        <option value="90">最近90天</option>
                    </select>
                    <label>指数分位:</label>
                    <select id="stats-percentile">
                        <option value="95" selected>P95</option>
                        <option value="99">P99</option>
                    </select>
                </div>
            </div>

            <div class="stats-filter">
                <h2>筛选条件</h2>
                <select id="stats-type">
                    <option value="overview">总览统计</option>
                    <option value="todos">待办</option>
                    <option value="challenges">挑战</option>
                    <option value="muscle">按肌肉群筛选</option>
                    <option value="exercise">按动作筛选</option>
                </select>

                <select id="stats-muscle-target" style="display: none;">
                    <option value="">全部肌肉位置</option>
                </select>

                <select id="stats-target">
                    <option value="">全部</option>
                    <!-- 动态加载选项 -->
                </select>
            </div>

            <div class="stats-dashboard">
                <!-- 动态加载总体统计和最佳表现 -->
            </div>

            <div id="exercise-trend-section" class="stats-section" style="display: none;">
                <div class="section-title-row">
                    <h2>📈 动作趋势</h2>
                    <select id="exercise-trend-mode">
                        <option value="best" selected>最佳表现</option>
                        <option value="total">总容量</option>
                    </select>
                </div>
                <div id="volume-chart" class="chart-container-large">
                    <!-- 动作趋势图 -->
                </div>
            </div>

            <div class="stats-section">
                <h2>📅 日历</h2>
                <div id="training-calendar" class="calendar-view">
                    <!-- 日历 -->
                </div>
            </div>

            <div class="stats-section">
                <h2>📋 当天明细</h2>
                <div id="day-records" class="day-records">
                    <p style="color: #6c757d;">点击日历中的日期查看当天明细</p>
                </div>
            </div>

            <div class="stats-actions">
                <button class="btn btn-primary" onclick="exportStatsReport()">📥 导出统计报告</button>
                <button class="btn btn-secondary" onclick="refreshStats()">🔄 刷新统计</button>
            </div>
        </div>

    </div>

    <!-- 添加动作弹窗 -->
    <div id="exercise-modal" class="modal">
        <div class="modal-content">
            <h2 id="exercise-modal-title">添加动作</h2>
            <form id="exercise-form">
                <div class="form-group">
                    <label>动作名称</label>
                    <input type="text" id="exercise-name" required />
                </div>
                <div class="form-group">
                    <label>训练肌肉部位</label>
                    <input type="text" id="exercise-muscle" required placeholder="如：胸肌、背部、腿部" />
                </div>
                <div class="form-group">
                    <label>单位类型</label>
                    <select id="exercise-unit" required>
                        <option value="kg">重量 (kg)</option>
                        <option value="reps">次数 (次)</option>
                        <option value="duration">持续时间 (秒)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>所属动作组</label>
                    <div id="exercise-group-checkboxes" class="checkbox-list">
                        <!-- 动态加载动作组复选框 -->
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="delete-exercise-modal-btn" class="btn btn-danger">删除动作</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal('exercise-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加动作组弹窗 -->
    <div id="group-modal" class="modal">
        <div class="modal-content">
            <h2 id="group-modal-title">添加动作组</h2>
            <form id="group-form">
                <div class="form-group">
                    <label>动作组名称</label>
                    <input type="text" id="group-form-name" required placeholder="如：胸肌训练" />
                </div>
                <div class="form-group">
                    <label>选择动作</label>
                    <div id="exercise-checkboxes" class="checkbox-list">
                        <!-- 动态加载动作复选框 -->
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('group-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="todo-completed-modal" class="modal">
        <div class="modal-content todo-completed-modal-content">
            <h2>已完成列表</h2>
            <div id="todo-completed-modal-list" class="todo-completed-modal-list">
                <p class="empty-hint">暂无已完成事项</p>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal('todo-completed-modal')">关闭</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="stats.js"></script>
</body>
</html>
